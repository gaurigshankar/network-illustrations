<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote radio unit — interactive field guide</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{
    --paper:#e9edf1;
    --panel:#ffffff;
    --line:#c8d1da;
    --ink:#18212b;
    --muted:#4d5b6a;
    --metal-dark:#414c58;
    --metal:#67737f;
    --metal-light:#8d99a5;
    --fin:#7b8794;
    --antenna:#c3ccd6;
    --antenna-edge:#9aa6b2;
    --pipe:#aab5c0;
    --rubber:#2b3036;
    --accent:#0b6a7d;
    --accent-soft:#d3e7ec;
    --focus:#6a2fd0;
    --led-green:#12855a;
    --led-red:#c0392b;
    --led-amber:#a86a00;
    --led-off:#7c8894;
    --label:12.5px;
    --caption:11px;
    --sans:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1600px;margin:0 auto;padding:20px 20px 40px}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
    padding:0 2px 16px;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:13px;font-weight:500;
    background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .btn[aria-pressed="true"]{background:var(--led-red);border-color:var(--led-red);color:#fff}
  .btn[aria-pressed="true"]:hover{color:#fff;border-color:var(--led-red)}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start}
  .stage{
    position:relative;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;
    height:min(74vh,720px);min-height:460px;overflow:hidden;
  }
  #diagram{display:block;width:100%;height:100%;touch-action:pan-y}
  #flow{position:absolute;inset:0;pointer-events:none}
  .rail{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;max-height:min(74vh,720px);min-height:460px;overflow:auto;
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .stage{height:56vh;min-height:360px}
    .rail{max-height:none;min-height:0}
  }

  /* ---------- rail typography ---------- */
  .rail h2{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .rail h3{
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 5px;
  }
  .rail p{margin:0 0 10px}
  .rail .lede{font-size:14px;color:var(--muted)}
  .rail ul{margin:0;padding-left:18px}
  .rail li{margin-bottom:5px}
  .rail .caption{font-size:12px;color:var(--muted);line-height:1.45}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .back{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;
    font:inherit;font-size:13px;font-weight:500;
    background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink);
  }
  .back:hover{border-color:var(--accent);color:var(--accent)}
  .back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .fault-item{border-left:3px solid var(--line);padding-left:10px;margin-bottom:10px}
  .fault-item .sym{font-weight:600}
  .fault-item .fix{color:var(--muted);font-size:13.5px}
  .rail.fault .fault-item{border-left-color:var(--led-red)}
  .legend{list-style:none;padding:0;margin:0}
  .legend li{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;font-size:13.5px}
  .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;margin-top:4px;border:1px solid rgba(0,0,0,.25)}
  .legend .state{font-weight:600}
  .legend .meaning{color:var(--muted)}
  .note{
    margin-top:16px;padding:10px 12px;background:#f2f6f8;border:1px solid var(--line);
    border-radius:8px;font-size:12px;color:var(--muted);line-height:1.45;
  }
  .banner{
    margin:0 0 14px;padding:8px 11px;border-radius:8px;
    background:#fbeceb;border:1px solid #e8bdb8;color:#8c2b1f;
    font-size:12.5px;font-weight:500;
  }

  /* ---------- svg parts ---------- */
  .part{cursor:pointer}
  .part .halo{fill:none;stroke:transparent;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  .part .hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:22;stroke-linecap:round;pointer-events:stroke}
  .part:hover .halo{stroke:var(--accent)}
  .part:focus{outline:none}
  .part:focus .halo{stroke:var(--focus);stroke-width:2.5;stroke-dasharray:6 3}
  .part.is-selected .halo{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
  #parts.pulse-once .halo{animation:pulse 1.7s ease-out 1}
  @keyframes pulse{
    0%,100%{stroke:transparent}
    35%{stroke:var(--accent);stroke-opacity:.55}
  }
  #stage.has-selection .part{opacity:.35;filter:saturate(.25);transition:opacity .3s ease,filter .3s ease}
  #stage.has-selection .part.is-selected{opacity:1;filter:none}
  .part{transition:opacity .3s ease,filter .3s ease}

  .lbl text{font-size:var(--label);fill:var(--ink);font-family:var(--sans)}
  .lbl .leader{stroke:var(--muted);stroke-width:1;fill:none;opacity:.75}
  .lbl .anchor{fill:var(--muted)}
  .lbl{cursor:pointer}
  .lbl:hover text{fill:var(--accent)}
  #stage.has-selection .lbl{opacity:0;pointer-events:none;transition:opacity .25s}
  #stage.has-selection .lbl.is-selected{opacity:1;pointer-events:auto}
  .lbl{transition:opacity .25s}

  .inset text{font-size:var(--caption);fill:var(--muted);font-family:var(--sans)}
  .inset .frame{fill:#f5f8fa;stroke:var(--line);stroke-width:1}
  .fault-only{display:none}
  #stage.fault .fault-only{display:inline}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div>
      <h1>Remote radio unit, tower top</h1>
      <p class="sub">Field-training diagram. Click a part, or press Tab then Enter, to open its detail.</p>
    </div>
    <div class="controls">
      <button class="btn" id="fault-toggle" aria-pressed="false">Fault mode: off</button>
      <button class="btn" id="reset-view">Reset view</button>
    </div>
  </header>

  <main>
    <section class="stage" id="stage">
      <svg id="diagram" viewBox="0 0 980 730" preserveAspectRatio="xMidYMid meet"
           role="group" aria-label="Cutaway illustration of a remote radio unit mounted on a tower-top pipe mount behind a panel antenna. Nine parts are individually selectable."></svg>
      <canvas id="flow" aria-hidden="true"></canvas>
    </section>
    <aside class="rail" id="rail" aria-live="polite">
      <div id="rail-body"></div>
    </aside>
  </main>
</div>

<script>
/* =========================================================================
   1. CONTENT MODEL — every string, figure and fault lives here.
      Drawing code below reads from PARTS and LED_STATES and hardcodes nothing.
   ========================================================================= */

// Depth helper: a point on the right-hand side face, u across the depth (0-100), v down.
function sidePoint(u, v) {
  return [BOX.x + BOX.w + u * DEPTH.x / 100, BOX.y + u * DEPTH.y / 100 + v];
}
function pts(list) { return list.map(p => p.join(',')).join(' '); }

/* Renders the gradients and the single soft shadow used anywhere in the drawing. */
function defs() {
  const d = svg.append('defs');
  const g1 = d.append('linearGradient').attr('id', 'gradFront').attr('x1', 0).attr('x2', 1);
  g1.append('stop').attr('offset', 0).attr('stop-color', '#8a95a1');
  g1.append('stop').attr('offset', 1).attr('stop-color', '#6d7885');
  const g2 = d.append('linearGradient').attr('id', 'gradSide').attr('x1', 0).attr('x2', 1);
  g2.append('stop').attr('offset', 0).attr('stop-color', '#5a6570');
  g2.append('stop').attr('offset', 1).attr('stop-color', '#48525d');
  const g3 = d.append('linearGradient').attr('id', 'gradPipe').attr('x1', 0).attr('x2', 1);
  g3.append('stop').attr('offset', 0).attr('stop-color', '#96a2ae');
  g3.append('stop').attr('offset', .45).attr('stop-color', '#c3ccd5');
  g3.append('stop').attr('offset', 1).attr('stop-color', '#8e9aa6');
  const g4 = d.append('linearGradient').attr('id', 'gradAntenna').attr('x1', 0).attr('x2', 1);
  g4.append('stop').attr('offset', 0).attr('stop-color', '#d3dae1');
  g4.append('stop').attr('offset', 1).attr('stop-color', '#bcc6d0');
  const f = d.append('filter').attr('id', 'softShadow').attr('x', '-20%').attr('y', '-20%')
             .attr('width', '150%').attr('height', '150%');
  f.append('feDropShadow').attr('dx', 6).attr('dy', 10).attr('stdDeviation', 10)
   .attr('flood-color', '#1c2733').attr('flood-opacity', .18);
}
defs();

/* Renders the RRU chassis: front face with heat-sink fins, right side face and visible underside. */
function drawChassis(g) {
  const fx = BOX.x, fy = BOX.y, fw = BOX.w, fh = BOX.h;
  const back = [fx + DEPTH.x, fy + DEPTH.y];
  g.attr('filter', 'url(#softShadow)');

  // underside, seen from below
  g.append('polygon')
   .attr('points', pts([[fx, fy + fh], [fx + fw, fy + fh],
                        [fx + fw + DEPTH.x, fy + fh + DEPTH.y], [fx + DEPTH.x, fy + fh + DEPTH.y]]))
   .attr('fill', '#3b444e').attr('stroke', 'var(--metal-dark)').attr('stroke-width', 1.5).attr('stroke-linejoin', 'round');
  // right side face
  g.append('polygon')
   .attr('points', pts([[fx + fw, fy], [fx + fw + DEPTH.x, fy + DEPTH.y],
                        [fx + fw + DEPTH.x, fy + fh + DEPTH.y], [fx + fw, fy + fh]]))
   .attr('fill', 'url(#gradSide)').attr('stroke', 'var(--metal-dark)').attr('stroke-width', 1.5).attr('stroke-linejoin', 'round');
  // front face
  g.append('rect').attr('x', fx).attr('y', fy).attr('width', fw).attr('height', fh).attr('rx', 4)
   .attr('fill', 'url(#gradFront)').attr('stroke', 'var(--metal-dark)').attr('stroke-width', 1.5);
  // heat-sink fins across the front face
  g.selectAll('line.fin').data(d3.range(fx + 9, fx + fw - 4, 8)).join('line')
   .attr('class', 'fin')
   .attr('x1', d => d).attr('x2', d => d).attr('y1', fy + 10).attr('y2', fy + fh - 22)
   .attr('stroke', 'var(--fin)').attr('stroke-width', .75).attr('opacity', .85);
  // fin tips carried over the side face
  g.selectAll('line.fintip').data(d3.range(6, 66, 8)).join('line')
   .attr('class', 'fintip')
   .attr('x1', d => sidePoint(d, 12)[0]).attr('y1', d => sidePoint(d, 12)[1])
   .attr('x2', d => sidePoint(d, 200)[0]).attr('y2', d => sidePoint(d, 200)[1])
   .attr('stroke', '#39424c').attr('stroke-width', .75).attr('opacity', .55);
  // label plate and fasteners

  g.append('path').attr('class', 'halo')
   .attr('d', `M${fx},${fy} H${fx + fw} L${back[0] + fw},${back[1]} V${fy + fh + DEPTH.y}
               H${fx + DEPTH.x} L${fx},${fy + fh} Z`);
}

const ordered = DRAW_ORDER.map(id => PARTS.find(p => p.id === id)).filter(Boolean);

const partSel = partsG.selectAll('g.part')
  .data(ordered, d => d.id)
  .join('g')
    .attr('class', 'part')
    .attr('id', d => 'part-' + d.id)
    .attr('tabindex', 0)
    .attr('role', 'button')
    .attr('aria-label', d => d.name + '. ' + d.function);

partSel.append('title').text(d => d.name);
partSel.each(function (d) { RENDERERS[d.id](d3.select(this), d); });

partSel
  .on('click', (e, d) => { e.stopPropagation(); select(d.id); })
  .on('keydown', (e, d) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); select(d.id); }
  });

/* Renders the leader line and wrapped text label for one part. */
function wrap(text, max) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  words.forEach(w => {
    if ((line + ' ' + w).trim().length > max && line) { lines.push(line); line = w; }
    else { line = (line + ' ' + w).trim(); }
  });
  if (line) lines.push(line);
  return lines;
}

const labelSel = labelsG.selectAll('g.lbl')
  .data(ordered.filter(d => LABELS[d.id]), d => d.id)
  .join('g')
    .attr('class', 'lbl')
    .attr('id', d => 'lbl-' + d.id)
    .attr('aria-hidden', 'true');

labelSel.each(function (d) {
  const L = LABELS[d.id];
  const g = d3.select(this);
  const lines = wrap(d.name, L.wrap);
  const startX = L.anchor === 'end' ? L.x - 4 : L.x + 4;
  g.append('path').attr('class', 'leader')
   .attr('d', `M${startX},${L.y - 4} L${L.to[0]},${L.to[1]}`);
  g.append('circle').attr('class', 'anchor').attr('cx', L.to[0]).attr('cy', L.to[1]).attr('r', 2.5);
  const t = g.append('text').attr('x', L.x).attr('y', L.y).attr('text-anchor', L.anchor);
  lines.forEach((ln, i) => {
    t.append('tspan').attr('x', L.x).attr('dy', i === 0 ? 0 : 15).text(ln);
  });
});
labelSel.on('click', (e, d) => { e.stopPropagation(); select(d.id); });

  const g = svg.append('g').attr('class', 'inset').attr('aria-hidden', 'true')
               .attr('transform', 'translate(810,452)');
  g.append('rect').attr('class', 'frame').attr('width', 150).attr('height', 190).attr('rx', 10);
  const cx = 62;
  g.append('path').attr('d', `M${cx - 26},168 L${cx - 9},26 L${cx + 9},26 L${cx + 26},168`)
   .attr('fill', 'none').attr('stroke', 'var(--metal-light)').attr('stroke-width', 1.5);
  g.selectAll('line.brace').data(d3.range(0, 7)).join('line')
   .attr('class', 'brace')
   .attr('x1', d => cx - 26 + d * 2.6).attr('y1', d => 168 - d * 20)
   .attr('x2', d => cx + 24 - d * 2.4).attr('y2', d => 158 - d * 20)
   .attr('stroke', 'var(--metal-light)').attr('stroke-width', .75).attr('opacity', .8);
  g.append('rect').attr('x', cx - 22).attr('y', 150).attr('width', 44).attr('height', 20).attr('rx', 3)
   .attr('fill', '#dfe5ea').attr('stroke', 'var(--metal-light)').attr('stroke-width', 1);
  g.append('circle').attr('cx', cx + 2).attr('cy', 34).attr('r', 9)
   .attr('fill', 'none').attr('stroke', 'var(--accent)').attr('stroke-width', 2);
  g.append('circle').attr('cx', cx + 2).attr('cy', 34).attr('r', 3).attr('fill', 'var(--accent)');
  g.append('text').attr('x', 84).attr('y', 32).text('You are here:');
  g.append('text').attr('x', 84).attr('y', 46).text('radio, tower top');
  g.append('text').attr('x', 84).attr('y', 158).text('BBU in the');
  g.append('text').attr('x', 84).attr('y', 172).text('cabinet below');
})();

/* =========================================================================
   7. ZOOM AND SELECTION
   ========================================================================= */

const zoom = d3.zoom()
  .scaleExtent([1, 4])
  .filter(e => e.type === 'mousedown')   // drag to pan only; wheel scrolls the page
  .on('zoom', e => {
    currentTransform = e.transform;
    viewport.attr('transform', e.transform);
  });

svg.call(zoom);

function zoomToNode(node) {
  const b = node.getBBox();
  const pad = 1.9;
  const k = Math.max(1, Math.min(4, Math.min(VB.w / (b.width * pad), VB.h / (b.height * pad))));
  const tx = VB.w / 2 - k * (b.x + b.width / 2);
  const ty = VB.h / 2 - k * (b.y + b.height / 2);
  svg.transition().duration(EASE_MS).ease(d3.easeCubicOut)
     .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

function select(id) {
  selectedId = id;
  stage.classList.add('has-selection');
  partSel.classed('is-selected', d => d.id === id);
  labelSel.classed('is-selected', d => d.id === id);
  const node = document.getElementById('part-' + id);
  if (node) { zoomToNode(node); node.focus({ preventScroll: true }); }
  renderRail(PARTS.find(p => p.id === id));
}

function deselect() {
  selectedId = null;
  stage.classList.remove('has-selection');
  partSel.classed('is-selected', false);
  labelSel.classed('is-selected', false);
  svg.transition().duration(EASE_MS).ease(d3.easeCubicOut)
     .call(zoom.transform, d3.zoomIdentity);
  renderRail(null);
}

// Exit path 1: clicking empty background (ignored if the pointer was dragged).
let downAt = null;
svg.on('mousedown', e => { downAt = [e.clientX, e.clientY]; });
svg.on('click', e => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  if (selectedId) deselect();
});
// Exit path 2: Escape.
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selectedId) deselect(); });
// Exit path 3: the Back control, created in renderRail below.

document.getElementById('reset-view').addEventListener('click', deselect);

/* =========================================================================
   8. SIDE RAIL
   ========================================================================= */

function ledList(container) {
  const ul = container.append('ul').attr('class', 'legend');
  LED_STATES[faultMode ? 'fault' : 'normal'].forEach(l => {
    const li = ul.append('li');
    li.append('span').attr('class', 'dot').style('background', l.colour);
    const txt = li.append('span');
    txt.append('span').attr('class', 'state').text(l.code + ' \u2014 ' + l.state + '. ');
    txt.append('span').attr('class', 'meaning').text(l.meaning);
  });
}

function section(container, heading, build) {
  container.append('h3').text(heading);
  build(container);
}

function renderRail(part) {
  railBody.html('');
  d3.select('#rail').classed('fault', faultMode);

  if (!part) {
    if (faultMode) railBody.append('div').attr('class', 'banner')
      .text('Fault mode is on. Indicators and connectors are shown in a failed state, and faults are listed first.');
    railBody.append('div').attr('class', 'eyebrow').text('Overview');
    railBody.append('h2').text(ORIENTATION.title);
    railBody.append('p').attr('class', 'lede').text(ORIENTATION.lede);
    section(railBody, 'What the indicators mean', ledList);
    railBody.append('p').attr('class', 'caption').text(ORIENTATION.keyboard);
    railBody.append('div').attr('class', 'note').text(ORIENTATION.disclaimer);
    return;
  }

  railBody.append('button').attr('class', 'back').attr('type', 'button')
    .text('\u2190 Back to overview')
    .on('click', deselect);

  if (faultMode) railBody.append('div').attr('class', 'banner')
    .text('Fault mode: symptoms first.');

  railBody.append('div').attr('class', 'eyebrow').text('Part detail');
  railBody.append('h2').text(part.name);
  railBody.append('p').attr('class', 'lede').text(part.function);

  const faults = c => {
    c.append('div').selectAll('div.fault-item').data(part.commonFaults).join('div')
      .attr('class', 'fault-item')
      .call(sel => {
        sel.append('div').attr('class', 'sym').text(d => d.symptom);
        sel.append('div').attr('class', 'fix').text(d => '\u2192 ' + d.check);
      });
  };

  if (faultMode) section(railBody, 'Common faults', faults);

  section(railBody, 'In', c => c.append('p').text(part.inputs));
  section(railBody, 'Out', c => c.append('p').text(part.outputs));
  section(railBody, 'How you recognise it on site', c => c.append('p').text(part.onSiteAppearance));

  section(railBody, 'Typical values', c => {
    c.append('ul').selectAll('li').data(part.typicalValues).join('li').text(d => d);
    c.append('p').attr('class', 'caption').style('margin-top', '6px')
     .text('Typical and vendor-dependent \u2014 illustrative ranges, not manufacturer specifications.');
  });

  if (part.id === 'status-leds') section(railBody, 'Indicator states shown now', ledList);

  if (!faultMode) section(railBody, 'Common faults', faults);

  section(railBody, 'Also called', c => c.append('p').text(part.vendorAliases));
}

/* =========================================================================
   9. FAULT MODE
   ========================================================================= */

/* Repaints the LED cluster and reveals fault markers for the current mode. */
function applyFaultVisuals() {
  const set = LED_STATES[faultMode ? 'fault' : 'normal'];
  d3.selectAll('circle.led')
    .attr('fill', function () {
      const s = set.find(l => l.code === this.getAttribute('data-code'));
      return s ? s.colour : 'var(--led-off)';
    });
  d3.select('#part-status-leds').select('title')
    .text(PARTS.find(p => p.id === 'status-leds').name + ': ' +
          set.map(l => l.code + ' ' + l.state).join(', '));
  d3.select('#part-status-leds')
    .attr('aria-label', 'Status LED cluster. ' + set.map(l => l.code + ': ' + l.state + ', ' + l.meaning).join(' '));
  stage.classList.toggle('fault', faultMode);
}

const faultBtn = document.getElementById('fault-toggle');
faultBtn.addEventListener('click', () => {
  faultMode = !faultMode;
  faultBtn.setAttribute('aria-pressed', String(faultMode));
  faultBtn.textContent = 'Fault mode: ' + (faultMode ? 'on' : 'off');
  applyFaultVisuals();
  renderRail(selectedId ? PARTS.find(p => p.id === selectedId) : null);
});

/* =========================================================================
   10. OPTIONAL CANVAS OVERLAY — RF and fronthaul flow particles only
   ========================================================================= */

const canvas = document.getElementById('flow');
const ctx = canvas.getContext('2d');
let view = { s: 1, ox: 0, oy: 0 };
let flows = [];

/* Samples the drawn cable paths so particles can ride along them. */
function buildFlows() {
  const make = (sel, colour, kind) => {
    const el = document.querySelector(sel);
    if (!el) return null;
    const len = el.getTotalLength();
    const pts = d3.range(0, 1.0001, 0.02).map(t => {
      const p = el.getPointAtLength(t * len);
      return [p.x, p.y];
    });
    return { pts, colour, kind, particles: d3.range(5).map(i => i / 5) };
  };
  flows = [
    make('#part-coax-jumper path[stroke="#3d444b"]', '#d98c00', 'rf'),
    make('#part-fibre-lc path[stroke="#59636e"]', '#0b6a7d', 'data')
  ].filter(Boolean);
}

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(r.width / VB.w, r.height / VB.h);
  view = { s, ox: (r.width - VB.w * s) / 2, oy: (r.height - VB.h * s) / 2 };
}
new ResizeObserver(resize).observe(stage);
resize();

function pointOn(flow, t) {
  const n = flow.pts.length - 1;
  const i = Math.min(n - 1, Math.floor(t * n));
  const f = t * n - i;
  const a = flow.pts[i], b = flow.pts[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

function frame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const k = currentTransform.k, tx = currentTransform.x, ty = currentTransform.y;
  flows.forEach(flow => {
    if (faultMode) return;                          // nothing is flowing in a fault
    if (selectedId && selectedId !== 'coax-jumper' && selectedId !== 'fibre-lc') return;
    flow.particles.forEach((t, i) => {
      t += flow.kind === 'rf' ? 0.0035 : 0.0055;
      if (t > 1) t -= 1;
      flow.particles[i] = t;
      const p = pointOn(flow, t);
      const x = view.ox + view.s * (k * p[0] + tx);
      const y = view.oy + view.s * (k * p[1] + ty);
      ctx.beginPath();
      ctx.arc(x, y, Math.max(1.6, 2.4 * view.s * k), 0, Math.PI * 2);
      ctx.fillStyle = flow.colour;
      ctx.globalAlpha = .85;
      ctx.fill();
    });
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

/* =========================================================================
   11. START
   ========================================================================= */

applyFaultVisuals();
renderRail(null);
buildFlows();

if (!reduceMotion) {
  partsG.classed('pulse-once', true);
  setTimeout(() => partsG.classed('pulse-once', false), 1800);
  requestAnimationFrame(frame);
} else {
  canvas.style.display = 'none';
}
</script>
