<!doctype html>
<!--
  SCENE 4 — BASE CABINET         absolute 2:00.54 → 3:18.41   (local 0 → 77.87)

  Beats (cue ids from content/content.js):
    4.1   camera pulls back down the tower; the door swings open as a thin outline
    4.2   overall dimensions + rack-unit markings, so scale is never ambiguous
    4.3   BBU subrack        } shelf-by-shelf reveal, top to bottom, in
    4.4   rectifier shelf    } narration order — each was a drill-down level
    4.5   DC distribution    } in the interactive source diagram
    4.6   batteries, then the copper earth bar
    4.7   the stacking rationale, stated out loud and pinned to the shelves
    4.8   the mains-failure sequence arms
    4.9   – 4.13  the sequence itself: healthy → AC fails → battery → sag → LVD

  The source diagram's scrubbable mains-failure simulation is restaged as a
  fixed, narration-timed animation with a live bus-voltage readout, the alarm
  a technician would actually see at each stage, and the responsible element
  outlined (never fill-swapped).
  Keep-out: the avatar corner cutout occupies x 40–462, y 473–1004.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: Inter, sans-serif; }
        .ground { position: absolute; inset: 0; background: #f6f8fa; }
        #s4-svg { position: absolute; left: 0; top: 0; }
        .s4-h { font-size: 25px; font-weight: 700; letter-spacing: 0.15em; fill: #475569; }
        .s4-lab { font-size: 25px; font-weight: 700; fill: #0f172a; }
        .s4-det { font-size: 25px; fill: #64748b; }
        .s4-why { font-size: 25px; fill: #9333ea; }
        .s4-cap { font-size: 34px; font-weight: 700; fill: #0f172a; }
        .s4-u { font-size: 25px; fill: #64748b; }
        .s4-big { font-size: 62px; font-weight: 700; fill: #0f172a; }
      </style>

      <div id="root" data-composition-id="s4-cabinet" data-width="1920" data-height="1080">
        <div class="ground"></div>
        <svg id="s4-svg" width="1920" height="1080" viewBox="0 0 1920 1080">
          <text id="s4-heading" class="s4-h" x="80" y="76"></text>
          <text id="s4-dims" class="s4-det" x="620" y="128"></text>

          <!-- door, drawn as a thin outline hinged open to the left -->
          <g id="s4-door">
            <path d="M700 150 L520 214 L520 836 L700 900 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
            <path d="M544 262 L676 226 M544 322 L676 286" stroke="#cbd5e1" stroke-width="0.75"/>
            <text class="s4-det" x="610" y="560" text-anchor="middle" transform="rotate(-90 610 560)">Door + filter</text>
          </g>

          <!-- enclosure + mounting rail with rack-unit markings -->
          <g id="s4-shell">
            <rect x="700" y="150" width="440" height="750" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <line x1="722" y1="168" x2="722" y2="882" stroke="#64748b" stroke-width="1.5"/>
          </g>
          <g id="s4-rail"></g>
          <g id="s4-dimline">
            <path d="M1190 150 V900" stroke="#64748b" stroke-width="1"/>
            <path d="M1178 150 H1202 M1178 900 H1202" stroke="#64748b" stroke-width="1"/>
            <text id="s4-dimtext" class="s4-det" x="1206" y="196"></text>
          </g>

          <!-- ===================== shelves, top to bottom ================= -->
          <!-- AC input + surge protection -->
          <g id="s4-ac">
            <rect x="742" y="168" width="120" height="44" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
            <text class="s4-det" x="874" y="198">AC in + SPD</text>
            <path id="s4-ac-feed" d="M802 212 V244" stroke="#0f172a" stroke-width="1.5" fill="none"/>
          </g>

          <!-- BBU subrack -->
          <g id="s4-bbu">
            <rect x="742" y="244" width="376" height="118" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="756" y="258" width="34" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="796" y="258" width="34" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="836" y="258" width="34" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="876" y="258" width="34" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <!-- one vacant slot, blanking plate fitted -->
            <rect x="916" y="258" width="34" height="90" fill="#e2e8f0" stroke="#64748b" stroke-width="0.75" stroke-dasharray="4 3"/>
            <rect x="960" y="258" width="60" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <path d="M1030 258 V348 M1042 258 V348 M1054 258 V348 M1066 258 V348 M1078 258 V348 M1090 258 V348" stroke="#64748b" stroke-width="0.75"/>
            <circle cx="764" cy="274" r="4" fill="#15803d"/><circle cx="804" cy="274" r="4" fill="#15803d"/>
            <circle cx="844" cy="274" r="4" fill="#15803d"/><circle cx="884" cy="274" r="4" fill="#15803d"/>
            <text class="s4-det" x="933" y="378" text-anchor="middle">vacant · blanking plate</text>
          </g>

          <!-- rectifier shelf -->
          <g id="s4-rect">
            <rect x="742" y="404" width="376" height="106" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="756" y="418" width="66" height="78" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" id="s4-rm0"/>
            <rect x="828" y="418" width="66" height="78" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" id="s4-rm1"/>
            <rect x="900" y="418" width="66" height="78" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" id="s4-rm2"/>
            <rect x="972" y="418" width="66" height="78" fill="#e2e8f0" stroke="#64748b" stroke-width="0.75" stroke-dasharray="4 3"/>
            <rect x="1044" y="418" width="60" height="78" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <circle cx="789" cy="436" r="4" fill="#15803d" id="s4-rl0"/>
            <circle cx="861" cy="436" r="4" fill="#15803d" id="s4-rl1"/>
            <circle cx="933" cy="436" r="4" fill="#15803d" id="s4-rl2"/>
            <text class="s4-det" x="1036" y="530" text-anchor="middle">controller</text>
          </g>

          <!-- DC distribution: busbar, breakers, LVD, dry contacts -->
          <g id="s4-dist">
            <rect x="742" y="556" width="376" height="112" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
            <rect id="s4-busbar" x="756" y="570" width="348" height="14" rx="2" fill="#b45309"/>
            <g id="s4-breakers"></g>
            <g id="s4-lvd">
              <rect x="1040" y="600" width="64" height="52" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
              <path id="s4-lvd-closed" d="M1054 640 L1090 612" stroke="#0f172a" stroke-width="1.5"/>
              <path id="s4-lvd-open" d="M1054 640 L1084 638" stroke="#dc2626" stroke-width="1.5" opacity="0"/>
              <text class="s4-det" x="1072" y="690" text-anchor="middle">LVD</text>
            </g>
          </g>

          <!-- four 12 V VRLA batteries -->
          <g id="s4-batt">
            <rect x="742" y="712" width="376" height="170" rx="3" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="758" y="728" width="82" height="138" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="848" y="728" width="82" height="138" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="938" y="728" width="82" height="138" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="1028" y="728" width="82" height="138" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <!-- inter-cell links, polarity as strokes only -->
            <path d="M826 744 H862" stroke="#d92626" stroke-width="1.5" fill="none"/>
            <path d="M916 744 H952" stroke="#1f2937" stroke-width="1.5" fill="none"/>
            <path d="M1006 744 H1042" stroke="#d92626" stroke-width="1.5" fill="none"/>
            <text class="s4-det" x="784" y="812" text-anchor="middle">12 V</text>
            <text class="s4-det" x="874" y="812" text-anchor="middle">12 V</text>
            <text class="s4-det" x="964" y="812" text-anchor="middle">12 V</text>
            <text class="s4-det" x="1054" y="812" text-anchor="middle">12 V</text>
          </g>

          <!-- copper earth bar on the side wall -->
          <g id="s4-earthbar">
            <rect x="1122" y="430" width="14" height="300" rx="2" fill="#b45309"/>
            <path d="M1136 470 H1166 M1136 550 H1166 M1136 630 H1166" stroke="#b45309" stroke-width="1.5" fill="none"/>
            <path d="M1166 470 V730 L1166 840" stroke="#b45309" stroke-width="1.5" fill="none"/>
            <text class="s4-lab" x="1206" y="866"></text>
            <text class="s4-det" x="1206" y="896"></text>
          </g>

          <!-- fault / focus outline glows — outline only, never a fill swap -->
          <rect id="s4-glow-ac"   x="734" y="160" width="136" height="60"  rx="4" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0"/>
          <rect id="s4-glow-rect" x="734" y="396" width="392" height="122" rx="4" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0"/>
          <rect id="s4-glow-batt" x="734" y="704" width="392" height="186" rx="4" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0"/>
          <rect id="s4-glow-dist" x="734" y="548" width="392" height="128" rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0"/>
          <rect id="s4-glow-lvd"  x="1032" y="592" width="80"  height="68"  rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0"/>

          <!-- current path: rectifier → bus, and battery → bus -->
          <path id="s4-path-rect" d="M802 510 V556" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0"/>
          <path id="s4-path-batt" d="M900 712 V668" stroke="#d92626" stroke-width="1.5" fill="none" opacity="0"/>

          <!-- ===================== right-hand column ===================== -->
          <!-- shelf reveal stack (4.3 – 4.6) -->
          <g id="s4-stack"></g>

          <!-- stacking rationale (4.7) -->
          <g id="s4-why" opacity="0">
            <text id="s4-why-h" class="s4-h" x="1240" y="330"></text>
            <g id="s4-why-items"></g>
          </g>

          <!-- mains-failure panel (4.8 – 4.13) -->
          <g id="s4-mains" opacity="0">
            <text id="s4-mains-h" class="s4-h" x="1240" y="330" fill="#dc2626"></text>
            <g id="s4-stage-set"></g>

            <rect x="1240" y="410" width="620" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <text id="s4-ro-lab" class="s4-h" x="1272" y="452"></text>
            <text id="s4-ro-val" class="s4-big" x="1272" y="530">54.0</text>
            <text id="s4-ro-unit" class="s4-cap" x="1420" y="530">V</text>
            <g id="s4-ro-bar">
              <rect x="1500" y="500" width="330" height="14" rx="4" fill="#e2e8f0"/>
              <rect id="s4-ro-fill" x="1500" y="500" width="330" height="14" rx="4" fill="#15803d"/>
              <text id="s4-ro-note" class="s4-det" x="1500" y="480"></text>
            </g>

            <rect id="s4-al-box" x="1240" y="590" width="620" height="130" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
            <text id="s4-al-h" class="s4-h" x="1272" y="632">ALARM</text>
            <g id="s4-alname-set"></g>
            <rect id="s4-al-chip" x="1660" y="606" width="176" height="40" rx="20" fill="#fef3c7"/>
            <g id="s4-alsev-set"></g>

            <g id="s4-tech-set"></g>
            <g id="s4-dots"></g>
          </g>
        </svg>
      </div>

      <script>
        (function () {
          const C = window.CELLSITE, S = "s4", d = C.s4;
          const NS = "http://www.w3.org/2000/svg";
          const $ = function (s) { return document.querySelector(s); };
          const mk = function (tag, a) {
            const e = document.createElementNS(NS, tag);
            Object.keys(a || {}).forEach(function (k) { e.setAttribute(k, a[k]); });
            return e;
          };
          // pack ' · '-separated fragments into lines of at most `max` characters
          const packLines = function (text, max) {
            const parts = text.split(" · "), out = [];
            let cur = "";
            parts.forEach(function (p) {
              const cand = cur ? cur + " · " + p : p;
              if (cand.length > max && cur) { out.push(cur); cur = p; } else { cur = cand; }
            });
            if (cur) out.push(cur);
            return out;
          };

          $("#s4-heading").textContent = d.heading;
          $("#s4-dims").textContent =
            d.dims.height + " × " + d.dims.width + " · " + d.dims.rack + " · " + d.dims.note;
          $("#s4-dimtext").textContent = d.dims.height;
          $("#s4-earthbar").querySelectorAll("text")[0].textContent = d.earthBar.name;
          $("#s4-earthbar").querySelectorAll("text")[1].textContent = d.earthBar.detail;

          // ---- rack-unit markings down the mounting rail ---------------
          const rail = $("#s4-rail");
          for (let u = 0; u < 42; u++) {
            const y = 168 + u * 17;
            rail.appendChild(mk("line", { x1: 706, y1: y, x2: 722, y2: y, stroke: "#cbd5e1", "stroke-width": 0.75 }));
            if (u % 6 === 0) {
              const t = mk("text", { x: 700, y: y + 8, class: "s4-u", "text-anchor": "end" });
              t.textContent = (42 - u) + "U";
              rail.appendChild(t);
            }
          }

          // ---- labelled breakers on the DC panel -----------------------
          const brk = $("#s4-breakers");
          d.breakers.forEach(function (b, i) {
            const x = 758 + i * 48;
            brk.appendChild(mk("rect", { x: x, y: 600, width: 36, height: 52, rx: 3, fill: "#ffffff", stroke: "#0f172a", "stroke-width": 1.5 }));
            brk.appendChild(mk("path", { d: "M" + (x + 8) + " 640 L" + (x + 28) + " 614", stroke: "#0f172a", "stroke-width": 1.5 }));
            const t = mk("text", { x: x + 18, y: 674, class: "s4-u", "text-anchor": "middle" });
            t.textContent = b.pos;
            brk.appendChild(t);
          });

          // ---- right-hand shelf reveal stack ---------------------------
          const stack = $("#s4-stack");
          d.shelves.forEach(function (sh, i) {
            const y = 316 + i * 140;
            const g = mk("g", { id: "s4-row-" + sh.id });
            g.appendChild(mk("rect", { x: 1240, y: y - 28, width: 8, height: 104, rx: 2, fill: "#9333ea" }));
            const nm = mk("text", { x: 1272, y: y, class: "s4-lab" });
            nm.textContent = sh.name + (sh.expand ? "   —   " + sh.expand : "");
            g.appendChild(nm);
            packLines(sh.detail, 46).forEach(function (line, j) {
              const t = mk("text", { x: 1272, y: y + 32 + j * 30, class: "s4-det" });
              t.textContent = line;
              g.appendChild(t);
            });
            const w = mk("text", { x: 1272, y: y + 100, class: "s4-why" });
            w.textContent = sh.why;
            g.appendChild(w);
            stack.appendChild(g);
          });

          // ---- stacking rationale --------------------------------------
          $("#s4-why-h").textContent = d.stacking.heading;
          const wi = $("#s4-why-items");
          d.stacking.points.forEach(function (pt, i) {
            const g = mk("g", { id: "s4-why-" + i });
            g.appendChild(mk("rect", { x: 1240, y: 372 + i * 66, width: 8, height: 40, rx: 2, fill: "#9333ea" }));
            const t = mk("text", { x: 1272, y: 402 + i * 66, class: "s4-cap" });
            t.textContent = pt;
            g.appendChild(t);
            wi.appendChild(g);
          });

          // ---- mains panel static copy ---------------------------------
          $("#s4-mains-h").textContent = d.mains.heading;
          $("#s4-ro-lab").textContent = d.mains.readoutLabel;
          $("#s4-ro-unit").textContent = d.mains.unit;
          $("#s4-ro-note").textContent = d.mains.note;
          const dots = $("#s4-dots");
          const stageSet = $("#s4-stage-set"), alnSet = $("#s4-alname-set"),
                alsSet = $("#s4-alsev-set"), techSet = $("#s4-tech-set");
          d.mains.stages.forEach(function (st, i) {
            dots.appendChild(mk("circle", { cx: 1252 + i * 34, cy: 828, r: 8, fill: "#e2e8f0", id: "s4-dot-" + i }));
            const sev = st.alarm
              ? ((st.alarmState === "CRITICAL" || st.alarmState === "SITE DOWN") ? C.palette.fault : C.palette.warn)
              : C.palette.ok;
            const a = mk("text", { x: 1240, y: 384, class: "s4-cap", id: "s4-stage-" + i, opacity: 0 });
            a.textContent = st.label; stageSet.appendChild(a);
            const b = mk("text", { x: 1272, y: 682, class: "s4-cap", fill: sev, id: "s4-alname-" + i, opacity: 0 });
            b.textContent = st.alarm || "— no alarm —"; alnSet.appendChild(b);
            const c2 = mk("text", { x: 1748, y: 634, class: "s4-lab", "text-anchor": "middle", fill: sev, id: "s4-alsev-" + i, opacity: 0 });
            c2.textContent = st.alarmState; alsSet.appendChild(c2);
            const e = mk("text", { x: 1240, y: 778, class: "s4-det", id: "s4-tech-" + i, opacity: 0 });
            e.textContent = st.tech; techSet.appendChild(e);
          });

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // ---- 4.1 door swings open ------------------------------------
          const t41 = C.at("4.1", S);
          gsap.set(["#s4-bbu", "#s4-rect", "#s4-dist", "#s4-batt", "#s4-earthbar", "#s4-ac", "#s4-rail", "#s4-dimline", "#s4-dims"], { opacity: 0 });
          tl.fromTo("#s4-shell", { opacity: 0, scale: 0.94, transformOrigin: "920px 525px" },
            { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, t41);
          tl.fromTo("#s4-door", { opacity: 0, scaleX: 0.1, transformOrigin: "700px 525px" },
            { opacity: 1, scaleX: 1, duration: 0.9, ease: "power2.out" }, t41 + 0.3);

          // ---- 4.2 dimensions + rack units ------------------------------
          const t42 = C.at("4.2", S);
          tl.to("#s4-dims", { opacity: 1, duration: 0.5 }, t42);
          tl.to("#s4-dimline", { opacity: 1, duration: 0.5 }, t42 + 0.2);
          tl.to("#s4-rail", { opacity: 1, duration: 0.6 }, t42 + 0.35);
          tl.to("#s4-ac", { opacity: 1, duration: 0.5 }, t42 + 0.9);

          // ---- 4.3 – 4.6 shelf-by-shelf reveal, top to bottom ------------
          const shelfSel = { bbu: "#s4-bbu", rect: "#s4-rect", dist: "#s4-dist", batt: "#s4-batt" };
          d.shelves.forEach(function (sh) {
            const t = C.at(sh.cue, S);
            tl.to(shelfSel[sh.id], { opacity: 1, duration: 0.5, ease: "power2.out" }, t);
            tl.fromTo("#s4-row-" + sh.id, { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t);
          });
          // the earth bar lands with the batteries line, slightly after
          tl.to("#s4-earthbar", { opacity: 1, duration: 0.5 }, C.at("4.6", S) + 2.2);

          // ---- 4.7 stacking rationale ----------------------------------
          const t47 = C.at("4.7", S);
          tl.to("#s4-stack", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, t47 - 0.4);
          tl.to("#s4-why", { opacity: 1, duration: 0.45, ease: "power2.inOut" }, t47);
          d.stacking.points.forEach(function (_, i) {
            tl.fromTo("#s4-why-" + i, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4 }, t47 + i * 0.35);
          });

          // ---- 4.8 arm the sequence ------------------------------------
          const t48 = C.at("4.8", S);
          tl.to("#s4-why", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, t48);
          tl.to("#s4-mains", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, t48 + 0.4);

          // ---- 4.9 – 4.13 the mains-failure sequence --------------------
          const roVal = $("#s4-ro-val");
          const V_MIN = 40, V_MAX = 56;
          gsap.set("#s4-ro-fill", { scaleX: (d.mains.stages[0].v0 - V_MIN) / (V_MAX - V_MIN), transformOrigin: "0% 50%" });
          const glow = { ac: "#s4-glow-ac", rect: "#s4-glow-rect", batt: "#s4-glow-batt", dist: "#s4-glow-dist", lvd: "#s4-glow-lvd" };

          d.mains.stages.forEach(function (st, i) {
            const t = C.at(st.cue, S);
            const nextT = (i + 1 < d.mains.stages.length) ? C.at(d.mains.stages[i + 1].cue, S) : t + 4.2;
            const span = Math.max(0.8, nextT - t - 0.2);

            // stage label + technician note + alarm block: one node per stage,
            // swapped at the beat boundary so every frame is reproducible
            const sev = st.alarm ? (st.alarmState === "CRITICAL" || st.alarmState === "SITE DOWN"
              ? C.palette.fault : C.palette.warn) : C.palette.ok;
            ["stage", "alname", "alsev", "tech"].forEach(function (k) {
              d.mains.stages.forEach(function (_, j) {
                tl.set("#s4-" + k + "-" + j, { opacity: j === i ? 1 : 0 }, t);
              });
            });
            tl.set("#s4-al-box", { stroke: sev }, t);
            tl.set("#s4-al-chip", { fill: st.alarm ? "#fee2e2" : "#dcfce7" }, t);

            // progress dots
            tl.to("#s4-dot-" + i, { fill: sev, duration: 0.25 }, t);

            // live bus-voltage readout — tweened, so every frame is seek-safe
            const counter = { v: st.v0 };
            tl.to(counter, {
              v: st.v1, duration: span, ease: "none",
              onUpdate: function () { roVal.textContent = counter.v.toFixed(1); }
            }, t);
            tl.to("#s4-ro-fill", {
              scaleX: Math.max(0.02, (st.v1 - V_MIN) / (V_MAX - V_MIN)),
              transformOrigin: "0% 50%", duration: span, ease: "none"
            }, t);
            tl.to("#s4-ro-fill", { fill: sev, duration: 0.4 }, t);

            // outline the element responsible for this stage
            Object.keys(glow).forEach(function (k) {
              tl.to(glow[k], { opacity: k === st.focus ? 1 : 0, duration: 0.3 }, t);
            });
          });

          // current path hand-over: rectifier feed dies, battery feed takes it
          tl.to("#s4-path-rect", { opacity: 1, duration: 0.3 }, C.at("4.9", S));
          tl.to("#s4-path-rect", { opacity: 0, duration: 0.3 }, C.at("4.10", S) + 0.6);
          tl.to("#s4-path-batt", { opacity: 1, duration: 0.3 }, C.at("4.11", S));
          // LVD opens: contactor stroke goes red, loads grey out
          tl.to("#s4-lvd-closed", { opacity: 0, duration: 0.25 }, C.at("4.13", S) + 0.8);
          tl.to("#s4-lvd-open", { opacity: 1, duration: 0.25 }, C.at("4.13", S) + 0.8);
          tl.to(["#s4-bbu", "#s4-rect"], { opacity: 0.3, duration: 0.6 }, C.at("4.13", S) + 1.1);
          tl.to("#s4-path-batt", { opacity: 0, duration: 0.4 }, C.at("4.13", S) + 1.2);

          window.__timelines["s4-cabinet"] = tl;
        })();
      </script>
    </template>
